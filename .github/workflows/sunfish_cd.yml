name: Sunfish CD

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Upload firmware to Google Drive
    runs-on: ubuntu-latest
    container: ardupilot/ardupilot-dev-chibios:v0.1.3
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0
      - name: ccache cache files
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{github.workflow}}-ccache-${{github.ref}}
          restore-keys: |
            ${{github.workflow}}-ccache-
      - name: setup ccache
        run: |
          . .github/workflows/ccache.env
      - name: Setup GitHub CLI
        uses: wusatosi/setup-gh@v1
      - name: Setup Dependencies
        run: sudo apt update && sudo apt install -y unzip
      - name: Setup rclone
        uses: AnimMouse/setup-rclone@v1
        with:
          rclone_config: ${{ secrets.RCLONE_CONFIG }}
      - name: Build Sunfish firmware
        run: |
          git config --global --add safe.directory ${GITHUB_WORKSPACE}
          PATH="/usr/lib/ccache:/opt/gcc-arm-none-eabi-10/bin:$PATH"
          PATH="/github/home/.local/bin:$PATH"
          make sunfish
          ccache -s
      - name: Upload binaries to Google Drive with rclone
        run: |
          rclone copy \
            build/sunfish/$(git describe --tags) \
            gdrive:$(git describe --tags) \
            --create-empty-src-dirs \
            --transfers=4 --checkers=8 --progress

  sitl-docker-container:
    name: Build SITL Docker container
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - package: ardupilot-sitl
            dockerfile: sitl.Dockerfile
    env:
      DOCKERFILE: sitl.Dockerfile
      PACKAGE: ardupilot-sitl
      REGISTRY: ghcr.io
      IMAGE_NAME: ghcr.io/${{github.repository}}/${{matrix.package}}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{env.REGISTRY}}
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{env.IMAGE_NAME}}
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@v6
        id: push
        with:
          file: ${{matrix.dockerfile}}
          push: ${{github.ref == 'refs/heads/master'}}
          tags: ${{steps.meta.outputs.tags}}
          labels: ${{steps.meta.outputs.labels}}
          platforms: linux/amd64,linux/arm64
          build-args: COMMIT=${{github.sha}}
