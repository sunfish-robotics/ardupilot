name: Sunfish CD

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  sitl-docker-container:
    name: Build SITL Docker container (${{matrix.platform}})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - package: ardupilot-sitl
            dockerfile: sitl.Dockerfile
            platform: linux/amd64
            base_image: ardupilot/ardupilot-dev-base
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ghcr.io/${{github.repository}}/${{matrix.package}}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{env.REGISTRY}}
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{env.IMAGE_NAME}}
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@v7
        id: push
        with:
          file: ${{matrix.dockerfile}}
          push: ${{github.ref == 'refs/heads/master'}}
          tags: ${{steps.meta.outputs.tags}}
          labels: ${{steps.meta.outputs.labels}}
          platforms: ${{matrix.platform}}
          build-args: |
            GIT_COMMIT=${{github.sha}}
            BASE_IMAGE=${{matrix.base_image}}
          cache-from: type=gha,scope=${{ matrix.package }}
          cache-to: type=gha,mode=max,scope=${{ matrix.package }}
